# ============================================================================
# tmux 設定ファイル - ベストプラクティス
# ============================================================================

# --- プレフィックスキー ---
# Ctrl+Space をプレフィックスキーとして使用（Ctrl+b を解除）
unbind C-b
set -g prefix C-t
bind C-Space send-prefix

# --- 基本設定 ---
# 256色対応のターミナルを使用
set -g default-terminal "screen-256color"

# トゥルーカラー（24ビットカラー）対応を有効化
set -ga terminal-overrides ",screen-256color*:RGB"

# スクロールバックバッファのサイズを増加（デフォルトは2000行）
set -g history-limit 10000

# ウィンドウ・ペインのインデックスを0ではなく1から開始（キーボード配列に合わせる）
set -g base-index 1
set -g pane-base-index 1

# ウィンドウを閉じたとき番号を詰めて振り直す
set -g renumber-windows on

# マウス操作を有効化（クリック・スクロール・ペイン選択など）
set -g mouse on

# --- ウィンドウ・ペインの作成 ---
# 新しいウィンドウやペインは現在のディレクトリを引き継ぐ
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- キーバインド ---
# コピーモードとコマンドラインで vi スタイルのキー操作を使用
set -g mode-keys vi
set -g status-keys vi

# hjkl でペイン間を移動（vim と同じ操作感）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix+p/n でウィンドウを前後に切り替え（-r は繰り返し入力を許可）
bind -r p previous-window
bind -r n next-window

# Alt+hjkl でペインのサイズを変更（5セル単位）
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# | で水平分割、- で垂直分割（視覚的にわかりやすいキー）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 確認なしにペイン・ウィンドウを閉じる
bind x kill-pane
bind X kill-window

# prefix+r で設定ファイルをリロード
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- ステータスバー ---
# ステータスバーを画面下部に表示
set -g status-position bottom

# ステータスバーの配色（tmux 3.6+ の新しい構文）
set -g status-style bg=black,fg=white

# 左側：セッション名を緑色・太字で表示
set -g status-left "#[fg=green,bold]#S #[default]"
set -g status-left-length 20

# 右側：時刻と日付を表示
set -g status-right "#[fg=cyan]%H:%M:%S #[fg=green]%a %d-%b"
set -g status-right-length 30

# ウィンドウ一覧の表示形式（番号:名前）
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# アクティブウィンドウは青背景・白文字、非アクティブは黒背景・白文字
set -g window-status-current-style bg=blue,fg=white
set -g window-status-style bg=black,fg=white

# --- コピーモード ---
# v で選択開始、y または Enter でコピーしてコピーモードを抜ける（vi スタイル）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# prefix+p でバッファからペースト
bind p paste-buffer

# --- その他の設定 ---
# フォーカスイベントを有効化（ファイル監視ツールなどで利用）
set -g focus-events on

# デフォルトシェルを zsh に設定
set -g default-shell /bin/zsh

# ベル音を無効化
set -g bell-action none
set -g visual-bell off

# 他のウィンドウでアクティビティがあればステータスバーに通知
set -g monitor-activity on
set -g visual-activity on

# 複数クライアント接続時に最も小さい画面サイズに合わせる（aggressive resize）
set -g aggressive-resize on
